<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#04070d" />
    <meta name="description" content="blackwaves: games, movies, music, manga and a proxy browser in one tab." />
    <title>blackwaves</title>
    <link rel="icon" href="/favicon.ico" type="image/png" />

    <style>
      html, body { background: #04070d; margin: 0; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; }
      #boot img { width: 64px; opacity: .85; animation: boot 1.6s ease-in-out infinite; }

    <noscript>blackwaves needs javascript turned on.</noscript>
    <div id="boot"><img src="/favicon.ico" alt="" /></div>
