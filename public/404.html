<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | blackwaves</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400&family=Sniglet:wght@400&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #050507; --text: #ececf1; --muted: #8a8a96; --border: rgba(255,255,255,.14); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font-family: 'Lexend', system-ui, sans-serif; font-weight: 400; text-align: center; text-transform: lowercase; }
    h1 { font-family: 'Sniglet', 'Lexend', sans-serif; font-weight: 400; font-size: clamp(64px, 14vw, 120px); margin: 0; line-height: 1; }
    p { color: var(--muted); margin: 12px 0 26px; }
    a { display: inline-block; padding: 10px 20px; border-radius: 12px; border: 1px solid var(--border); color: var(--text); text-decoration: none; transition: background .2s, color .2s; }
    a:hover { background: var(--text); color: var(--bg); }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>This wave washed away. The page you're looking for doesn't exist.</p>
    <a href="/">Back to blackwaves</a>
  </main>
</body>
</html>
